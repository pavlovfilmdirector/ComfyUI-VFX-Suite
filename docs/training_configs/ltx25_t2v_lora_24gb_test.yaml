# =============================================================================
# LTX-2.5 22B text-to-video LoRA - LITE TEST for a 24 GB card (RTX 3090 Ti), WSL2
# =============================================================================
# Goal: check that LTX-2.5 trains on 24 GB at all, not to make a good LoRA.
#   8 clips, 512x288x49, 300 steps, rank 16, INT8 model, 8-bit Gemma 4, 8-bit AdamW,
#   gradient checkpointing, no validation videos during training (they need the most VRAM).
# Uses the current Lightricks ltx-trainer (configs with the "flexible" strategy) and the
# LTX-2.5 split pack that ComfyUI already has (transformer + Gemma 4 LTX encoder + 2 VAEs).
# Close ComfyUI, Unreal and other GPU apps before starting: the card must be nearly empty.
# =============================================================================

model:
  model_path: "/path/to/ComfyUI/models/diffusion_models/ltx-2.5/ltx-2.5-22b-dev-transformer-bf16.safetensors"
  text_encoder_path: "/path/to/ComfyUI/models/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
  video_vae_path: "/path/to/ComfyUI/models/vae/LTX-2.5/ltx-2.5-video-vae-bf16.safetensors"
  audio_vae_path: "/path/to/ComfyUI/models/vae/LTX-2.5/ltx-2.5-audio-vae-bf16.safetensors"
  training_mode: "lora"
  load_checkpoint: null          # a checkpoint file or the checkpoints folder to resume

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules: ["to_k", "to_q", "to_v", "to_out.0"]

training_strategy:
  name: "flexible"
  video:
    is_generated: true
    latents_dir: "latents"
  audio:
    is_generated: true
    latents_dir: "audio_latents"

optimization:
  learning_rate: 1e-4
  steps: 300
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw8bit"
  scheduler_type: "linear"
  scheduler_params: { }
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: "int8-quanto"     # if it still runs out of memory: "int4-quanto"
  load_text_encoder_in_8bit: true
  offload_optimizer_during_validation: true

data:
  preprocessed_data_root: "/path/to/LTX_2.5_test/dataset_lite/.precomputed"
  num_dataloader_workers: 2

validation:
  samples:
    - prompt: >-
        A cinematic shot of an off-road truck driving fast along a dusty rural road, kicking up a thick
        cloud of dust, small buildings and mountains in the hazy background. The audio captures the roar
        of the engine and gravel under the tyres.
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  video_dims: [ 512, 288, 49 ]
  frame_rate: 24.0
  seed: 42
  inference_steps: 20
  interval: null                  # no validation videos during the test; render with ComfyUI afterwards
  video_cfg_scale: 3.0
  audio_cfg_scale: 7.0
  video_stg_scale: 1.0
  audio_stg_scale: 1.0
  stg_blocks: [ 28 ]
  guidance_rescale: 0.7
  generate_audio: true
  skip_initial_validation: true

checkpoints:
  interval: 100
  keep_last_n: -1
  precision: "bfloat16"

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: { }

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: false

seed: 42
output_dir: "/path/to/LTX_2.5_test/outputs/t2v_lite"
