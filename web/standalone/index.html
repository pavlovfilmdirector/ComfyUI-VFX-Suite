<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KESHIKI (景色) VFX AI Studio — Minimalist Edition</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/vfx/studio/favicon.png?v=3">
    <link rel="icon" type="image/x-icon" href="/vfx/studio/favicon.ico?v=3">
    <link rel="shortcut icon" href="/vfx/studio/favicon.ico?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/extensions/ComfyUI-VFX-Suite/css/layout_editor.css">
    <script src="/extensions/ComfyUI-VFX-Suite/lib/lucide.min.js"></script>
    <style>
        :root {
            --bg-canvas: #0f0f11;
            --bg-panel: #141416;
            --bg-card: rgba(20, 20, 22, 0.88);
            --bg-elevated: #1b1b1f;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text-primary: #e1e1e4;
            --text-secondary: rgba(255, 255, 255, 0.60);
            --text-muted: rgba(255, 255, 255, 0.38);
            --accent-white: #ffffff;
            --accent-cyan: #ffffff;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-canvas);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            line-height: 1.25;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .vfx-modal-backdrop {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1000 !important;
            background: var(--bg-canvas) !important;
        }
        /* Subtle custom scrollbars */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f0f11; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

        /* Allow normal text selection in chat, outputs, logs, prompts and text containers */
        #full-agent-chat-history,
        #full-agent-chat-history *:not(button):not(i):not(svg):not(img),
        #dock-agent-response-4lines,
        #dock-agent-response-4lines *:not(button):not(i):not(svg):not(img),
        .vfx-selectable,
        .vfx-chat-message,
        .vfx-prompt-selectable {
            user-select: text !important;
            -webkit-user-select: text !important;
            cursor: text;
        }
        button, .vfx-btn, .ue-btn {
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        /* STRICT TWO-COLOR MONOCHROME WITH SHADES OF GRAY */
        button, .vfx-btn, .ue-btn {
            border-color: rgba(255, 255, 255, 0.12);
        }
        button:hover, .vfx-btn:hover, .ue-btn:hover {
            border-color: rgba(255, 255, 255, 0.28);
        }
        /* Remove chromatic colors from all icons */
        i[data-lucide], svg.lucide, .lucide {
            stroke: currentColor;
        }
        /* Sliders */
        input[type="range"] {
            accent-color: #ffffff !important;
        }
        /* Badges / pills */
        .vfx-status-pill, .ue-actor-badge, .vfx-render-badge-pill {
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
    </style>

    <!-- Three.js and DCC Loaders -->
    <script src="/extensions/ComfyUI-VFX-Suite/lib/three.min.js"></script>
    <script src="/extensions/ComfyUI-VFX-Suite/lib/fflate.min.js"></script>
    <script src="/extensions/ComfyUI-VFX-Suite/lib/OrbitControls.js"></script>
    <script src="/extensions/ComfyUI-VFX-Suite/lib/TransformControls.js"></script>
    <script src="/extensions/ComfyUI-VFX-Suite/lib/OBJLoader.js"></script>
    <script src="/extensions/ComfyUI-VFX-Suite/lib/GLTFLoader.js"></script>
    <script src="/extensions/ComfyUI-VFX-Suite/lib/FBXLoader.js"></script>
</head>
<body>
    <div id="studio-app-root"></div>

    <script type="module">
        import { initStandaloneLayoutStudio } from "/vfx/studio/standalone_studio.js";
        if (document.readyState === "loading") {
            window.addEventListener("DOMContentLoaded", () => initStandaloneLayoutStudio());
        } else {
            initStandaloneLayoutStudio();
        }
    </script>
</body>
</html>
